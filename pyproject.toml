[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "author-agent"
version = "0.31.2"
description = "Local-first indie-author marketing assistant with Ollama, SQLite RAG, FastAPI, and safe Git website updates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pypdf>=5.0.0",
  "PyMuPDF>=1.24.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0.2",
  "requests>=2.32.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pre-commit>=3.8.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "types-PyYAML>=6.0.12.20240808",
  "types-requests>=2.32.0.20240914",
]

[project.scripts]
author-agent = "author_agent.main:main"
author-agent-web = "author_agent.web_runner:main"
author-agent-daemon = "author_agent.daemon_runner:main"

[tool.setuptools.packages.find]
include = ["author_agent*"]

[tool.setuptools.package-data]
author_agent = ["web_static/*.html", "prompt_templates/*.txt", "evaluation/fixtures/*.json", "demo_data/*.pdf"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "pypdf"
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["I001"]
