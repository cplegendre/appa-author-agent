<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Author Agent</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172033;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.shell{max-width:1320px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.top h1{margin:0;font-size:1.65rem}.local{background:#e8f5e9;color:#1b5e20;padding:7px 10px;border-radius:999px;font-size:.82rem;font-weight:700}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid #ccd3dc;background:white;padding:9px 14px;border-radius:10px;cursor:pointer}.tab.active{background:#172033;color:white}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:minmax(330px,.75fr) minmax(500px,1.25fr);gap:18px}.card{background:white;border:1px solid #dbe0e6;border-radius:14px;padding:18px;box-shadow:0 5px 18px rgba(31,41,55,.04)}h2,h3{margin-top:0}label{display:block;font-size:.86rem;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #c8d0da;border-radius:9px;padding:10px;font:inherit;background:white}textarea{min-height:180px;resize:vertical;line-height:1.45}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row .fit{flex:0 0 auto}.btn{border:0;border-radius:9px;padding:9px 13px;background:#172033;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#eef1f5;color:#172033;border:1px solid #ccd3dc}.btn.danger{background:#9b2c2c}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.draft{border-top:1px solid #edf0f3;padding-top:16px;margin-top:16px}.draft:first-child{border-top:0;padding-top:0}.draft-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.badge{font-size:.8rem;padding:4px 8px;border-radius:999px;background:#eef1f5}.ok{background:#e8f5e9;color:#1b5e20}.warn{background:#fff3cd;color:#725400}.bad{background:#fde8e8;color:#8a1c1c}.status{margin-top:12px;padding:10px 12px;border-radius:9px;background:#f2f5f8;white-space:pre-wrap}.error{background:#fde8e8;color:#8a1c1c}.success{background:#e8f5e9;color:#1b5e20}.hidden{display:none!important}.diff{background:#111827;color:#d1d5db;border-radius:10px;padding:12px;max-height:340px;overflow:auto;white-space:pre-wrap;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}.preview{width:100%;height:650px;border:1px solid #ccd3dc;border-radius:12px;background:white}.meta{color:#667085;font-size:.88rem}.approval{border:1px solid #b7d8bc;background:#f2fbf3}.section-title{display:flex;justify-content:space-between;align-items:center}.review-banner{margin:0 0 18px;background:#fff7d6;border:1px solid #e5c95c;border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.history-list{display:grid;gap:10px}.history-item{border:1px solid #dbe0e6;border-radius:10px;padding:12px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}.history-item:hover{border-color:#94a3b8;background:#f8fafc}.history-meta{font-size:.82rem;color:#667085}.history-title{font-weight:700}.history-status{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #aaa;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.grid{grid-template-columns:1fr}.preview{height:560px}}
</style>
</head>
<body><div class="shell">
<div class="top"><div><h1>Author Agent</h1><div class="meta">Local drafting, RAG checks, preview and website approval workflow.</div></div><span class="local">127.0.0.1 only</span></div>
<div id="reviewBanner" class="review-banner hidden"><div><strong>Needs your review</strong><div id="reviewBannerText" class="meta"></div></div><button class="btn" onclick="showNeedsReview()">Review now</button></div>
<div class="tabs"><button class="tab active" data-tab="release">Release</button><button class="tab" data-tab="evergreen">Evergreen</button><button class="tab" data-tab="today">Today</button><button class="tab" data-tab="history">History</button></div>

<section id="release" class="panel active"><div class="grid">
<div class="card"><h2>Release generation</h2><form id="releaseForm">
<label>Manuscript (PDF/TXT/MD)</label><input type="file" name="book" required accept=".pdf,.txt,.md">
<label>Promotional image</label><input type="file" name="image" accept="image/*">
<div class="row"><div><label>Release date</label><input type="date" name="release_date" required></div><div><label>Status</label><select name="published"><option value="false">Scheduled / teaser</option><option value="true">Published</option></select></div></div>
<label>Book URL</label><input name="book_url" placeholder="https://…">
<div class="actions"><button class="btn" type="submit">Generate</button></div></form><div id="releaseStatus"></div></div>
<div id="releaseWorkspace" class="card hidden"></div></div></section>

<section id="evergreen" class="panel"><div class="grid">
<div class="card"><h2>Evergreen generation</h2><form id="evergreenForm">
<label>Date</label><input type="date" name="post_date" required>
<label>Optional image</label><input type="file" name="image" accept="image/*">
<div class="actions"><button class="btn" type="submit">Generate evergreen</button></div></form><div id="evergreenStatus"></div></div>
<div id="evergreenWorkspace" class="card hidden"></div></div></section>

<section id="today" class="panel"><div class="grid">
<div class="card"><h2>Run today's orchestrator</h2>
<label>Date (blank = today)</label><input id="todayDate" type="date">
<label>Release look-ahead window (days)</label><input id="todayWindow" type="number" min="0" value="1">
<label class="row" style="justify-content:flex-start"><input id="todayForce" class="fit" type="checkbox" style="width:auto"> <span>Force regeneration</span></label>
<div class="actions"><button id="todayRun" class="btn">Run today</button></div><div id="todayStatus"></div></div>
<div id="todayWorkspace" class="card hidden"></div></div></section>

<section id="history" class="panel"><div class="grid">
<div class="card"><div class="section-title"><h2>History</h2><button class="btn secondary" onclick="loadHistory()">Refresh</button></div>
<label>Filter</label><select id="historyFilter" onchange="loadHistory()"><option value="all">All</option><option value="needs_review">Needs review only</option><option value="approved">Approved only</option></select>
<div id="historyList" class="history-list" style="margin-top:14px"></div></div>
<div id="historyWorkspace" class="card hidden"></div></div></section>
</div>
<script>
const state={release:null,evergreen:null,today:null,history:null};
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(el,msg,type=''){el.innerHTML=`<div class="status ${type}">${esc(msg)}</div>`}
function busy(btn,on,label){if(!btn)return;if(on){btn.dataset.old=btn.textContent;btn.disabled=true;btn.innerHTML=`<span class="spinner"></span>${esc(label||'Working…')}`}else{btn.disabled=false;btn.textContent=btn.dataset.old||'Done'}}
function checkBadge(c){if(!c||c.max_similarity==null)return '<span class="badge ok">✅ no comparable history</span>';let n=Number(c.max_similarity);let cls=c.warning?(n>=.86?'bad':'warn'):'ok';let icon=c.warning?(n>=.86?'❌':'⚠️'):'✅';return `<span class="badge ${cls}">${icon} similarity ${n.toFixed(3)}</span>`}
async function api(url,opts={}){let r=await fetch(url,opts);let data;try{data=await r.json()}catch{data={detail:await r.text()}}if(!r.ok)throw new Error(data.detail||`HTTP ${r.status}`);return data}
function socialOf(data){return data.social&&typeof data.social==='object'?data.social:data}
function renderWorkspace(kind,payload){state[kind]=payload;const host=document.getElementById(kind+'Workspace');host.classList.remove('hidden');const d=payload.data,s=socialOf(d),checks=d.duplicate_check||{},isRelease=!!d.profile;const fields=isRelease?['facebook','instagram','teaser']:['facebook','instagram'];let drafts=fields.map(f=>`<div class="draft"><div class="draft-head"><h3>${f[0].toUpperCase()+f.slice(1)}</h3><span id="badge-${kind}-${f}">${checkBadge(checks[f])}</span></div><textarea id="draft-${kind}-${f}">${esc(s[f]||'')}</textarea><div class="actions"><button class="btn secondary" onclick="regen('${kind}','${f}',this)">Regenerate</button><button class="btn secondary" onclick="checkDup('${kind}','${f}',this)">Check duplicates</button><button class="btn secondary" onclick="copyDraft('${kind}','${f}',this)">Copy</button></div></div>`).join('');
let website='';if(d.profile){let w=d.website||{};website=`<div class="draft"><div class="section-title"><h3>Website update</h3><span class="badge">${esc(w.format||'not detected')}</span></div><div class="meta">File: ${esc(w.file||'—')} · Status: ${esc(w.status||'—')}</div><pre id="diff-${kind}" class="diff">${esc(w.diff||w.reason||'No diff available.')}</pre><div class="actions"><button class="btn" onclick="prepareSite('${kind}',this)" ${d.published?'':'disabled'}>Prepare (branch + commit)</button><button id="push-${kind}" class="btn danger" onclick="pushSite('${kind}',this)" disabled>Push</button></div><div id="siteStatus-${kind}"></div></div>`}
host.innerHTML=`<div class="section-title"><h2>Drafts</h2><span class="meta">${esc(payload.output_file)}</span></div>${drafts}<div class="draft"><div class="section-title"><h3>Visual preview</h3><button class="btn secondary" onclick="refreshPreview('${kind}',this)">Refresh preview</button></div><iframe id="preview-${kind}" class="preview"></iframe></div>${website}<div class="draft approval"><h3>Approval</h3><p class="meta">Approval writes the final FB/IG drafts back into the SQLite RAG. It does not publish them.</p><button class="btn" onclick="approve('${kind}',this)">Mark approved</button><div id="approveStatus-${kind}"></div></div>`;refreshPreview(kind,null)}
async function persist(kind){let p=state[kind],d=p.data,s=socialOf(d),fields=d.profile?['facebook','instagram','teaser']:['facebook','instagram'];let drafts={};for(let f of fields){let el=document.getElementById(`draft-${kind}-${f}`);if(el){drafts[f]=el.value;s[f]=el.value}}await api(`/api/output/${encodeURIComponent(p.output_file)}/drafts`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({drafts})})}
async function regen(kind,field,btn){try{await persist(kind);busy(btn,true,'Regenerating…');let r=await api(`/api/output/${encodeURIComponent(state[kind].output_file)}/regenerate/${field}`,{method:'POST'});document.getElementById(`draft-${kind}-${field}`).value=r.text;socialOf(state[kind].data)[field]=r.text;state[kind].data.duplicate_check[field]=r.duplicate_check;document.getElementById(`badge-${kind}-${field}`).innerHTML=checkBadge(r.duplicate_check);await refreshPreview(kind,null)}catch(e){alert(e.message)}finally{busy(btn,false)}}
async function checkDup(kind,field,btn){try{busy(btn,true,'Checking…');let text=document.getElementById(`draft-${kind}-${field}`).value;let r=await api(`/api/output/${encodeURIComponent(state[kind].output_file)}/check/${field}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});state[kind].data.duplicate_check[field]=r;document.getElementById(`badge-${kind}-${field}`).innerHTML=checkBadge(r)}catch(e){alert(e.message)}finally{busy(btn,false)}}
async function copyDraft(kind,field,btn){let text=document.getElementById(`draft-${kind}-${field}`).value;await navigator.clipboard.writeText(text);let old=btn.textContent;btn.textContent='Copied ✓';setTimeout(()=>btn.textContent=old,1000)}
async function refreshPreview(kind,btn){try{if(btn){busy(btn,true,'Refreshing…');await persist(kind)}let html=await (await fetch(`/api/output/${encodeURIComponent(state[kind].output_file)}/preview?x=${Date.now()}`)).text();document.getElementById(`preview-${kind}`).srcdoc=html}catch(e){alert(e.message)}finally{if(btn)busy(btn,false)}}
async function prepareSite(kind,btn){let box=document.getElementById(`siteStatus-${kind}`);try{await persist(kind);busy(btn,true,'Preparing…');let r=await api(`/api/output/${encodeURIComponent(state[kind].output_file)}/website/prepare`,{method:'POST'});state[kind].push_token=r.push_token;state[kind].data.website=r.website;document.getElementById(`diff-${kind}`).textContent=r.website.diff||'No new diff (already prepared).';document.getElementById(`push-${kind}`).disabled=false;status(box,`Prepared ${r.website.branch}. Push remains manual until you click Push.`, 'success')}catch(e){status(box,e.message,'error')}finally{busy(btn,false)}}
async function pushSite(kind,btn){let box=document.getElementById(`siteStatus-${kind}`);if(!confirm('Push the prepared branch to origin? This does NOT merge it.'))return;try{busy(btn,true,'Pushing…');let r=await api(`/api/output/${encodeURIComponent(state[kind].output_file)}/website/push`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({push_token:state[kind].push_token})});btn.disabled=true;status(box,`Pushed branch ${r.branch}. Merge remains manual.`, 'success')}catch(e){status(box,e.message,'error')}finally{busy(btn,false)}}
async function approve(kind,btn){let box=document.getElementById(`approveStatus-${kind}`);try{await persist(kind);busy(btn,true,'Approving…');let r=await api(`/api/output/${encodeURIComponent(state[kind].output_file)}/approve`,{method:'POST'});state[kind].data.approved=true;status(box,`Approved and registered in RAG: ${(r.registered||[]).join(', ')||'no social fields'}.`, 'success');await loadNeedsReview();if(kind==='history')await loadHistory()}catch(e){status(box,e.message,'error')}finally{busy(btn,false)}}

function activateTab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===name));if(name==='history')loadHistory()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>activateTab(b.dataset.tab));
async function loadHistory(){let host=document.getElementById('historyList');try{let filter=document.getElementById('historyFilter').value;let r=await api(`/api/history?filter=${encodeURIComponent(filter)}`);if(!r.items.length){host.innerHTML='<div class="meta">No matching generated outputs.</div>';return}host.innerHTML=r.items.map(i=>`<div class="history-item" onclick="openHistory('${esc(i.output_file)}')"><div><div class="history-title">${esc(i.title)}</div><div class="history-meta">${esc(i.date||'unknown date')} · ${esc(i.mode)} · ${esc(i.output_file)}</div></div><div class="history-status"><span class="badge ${i.approved?'ok':'warn'}">${i.approved?'✅ approved':'⚠️ review'}</span><span class="badge">site: ${esc(i.website_push_status)}</span></div></div>`).join('')}catch(e){host.innerHTML=`<div class="status error">${esc(e.message)}</div>`}}
async function openHistory(name){try{let r=await api(`/api/output/${encodeURIComponent(name)}`);activateTab('history');renderWorkspace('history',r)}catch(e){alert(e.message)}}
async function loadNeedsReview(){try{let r=await api('/api/history?filter=needs_review');let banner=document.getElementById('reviewBanner');if(r.count>0){banner.classList.remove('hidden');document.getElementById('reviewBannerText').textContent=`${r.count} generated output${r.count===1?'':'s'} waiting for approval.`}else{banner.classList.add('hidden')}}catch(e){console.warn('Could not load review backlog',e)}}
function showNeedsReview(){document.getElementById('historyFilter').value='needs_review';activateTab('history')}
for(let id of ['releaseForm','evergreenForm'])document.getElementById(id).addEventListener('submit',async e=>{e.preventDefault();let kind=id==='releaseForm'?'release':'evergreen',btn=e.submitter,box=document.getElementById(kind+'Status');try{busy(btn,true,'Generating…');status(box,'Generation is running through your local Ollama + RAG pipeline…');let fd=new FormData(e.target);if(kind==='release')fd.set('published',fd.get('published')==='true');let r=await api(`/api/${kind}`,{method:'POST',body:fd});renderWorkspace(kind,r);status(box,'Generation complete. Nothing has been published.', 'success');await loadNeedsReview()}catch(err){status(box,err.message,'error')}finally{busy(btn,false)}});
document.getElementById('todayRun').onclick=async function(){let box=document.getElementById('todayStatus');try{busy(this,true,'Running…');let payload={date:document.getElementById('todayDate').value,window:Number(document.getElementById('todayWindow').value),force:document.getElementById('todayForce').checked};let r=await api('/api/today',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let kind=(r.data.profile?'today':'today');renderWorkspace(kind,r);status(box,`Today chose: ${r.manifest.mode}. Nothing has been published.`, 'success');await loadNeedsReview()}catch(e){status(box,e.message,'error')}finally{busy(this,false)}};
const today=new Date().toISOString().slice(0,10);document.querySelector('[name=release_date]').value=today;document.querySelector('[name=post_date]').value=today;loadNeedsReview();
</script></body></html>
